server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compressão Gzip otimizada para bundles JS/CSS/JSON
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Cabeçalhos de segurança em profundidade (Princípio III da Constituição)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Endpoint de verificação de saúde para Cloud Run Startup/Liveness Probe
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Cache imutável de longa duração para ativos estáticos com hash gerados pelo Vite (FR-002)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # SPA Fallback: rotas profundas (/pacientes/123, etc.) entregam index.html sem cache (FR-002)
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /index.html;
    }
}
